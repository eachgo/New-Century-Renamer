name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # gui/go.mod 用到了 go 1.27 的 `tool` 指令,老工具链解析不了。
  # 这里显式要求新版本;setup-go 装了之后本地不必再升级。
  GOTOOLCHAIN: auto

jobs:
  build:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # GUI 需要 Go 1.27(gui/go.mod 的 `tool` 指令),
      # 所以按 gui/go.mod 定版本,而不是根模块那个 1.22。
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum

      # ubuntu-latest 的镜像里只有 fonts-noto-color-emoji,没有任何中日韩
      # 字体。mygo 的 Linux 文本后端走 Pango,找不到字形时返回空位图——
      # 界面上所有中文都不画,量像素的对比度测试于是读到"整块一种颜色"。
      # macOS 自带 PingFang、Windows 自带雅黑,所以只有 Linux 需要装。
      - name: 安装中文字体 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh | head -5

      - name: Go 版本
        run: go version && go env GOTOOLCHAIN

      - name: 格式检查
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l . 2>/dev/null | grep -v '^gui/' || true)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (core + cli)
        run: go vet ./...

      - name: 测试 core
        run: go test ./... -count=1

      - name: 构建 CLI
        run: go build ./cmd/ncreamer

      # GUI 依赖 mygo(纯 Go 无 cgo),三平台都能编译;
      # 但只有 Windows 产物是给用户双击用的,其余平台仅作编译回归。
      - name: 构建 GUI
        working-directory: gui
        run: go build .

      # 端到端测试(TestE2E*)以前要读 testfile/ 里的真实音频/PDF,那个目录
      # 约 200MB、不入库,于是这里 -skip '^TestE2E' —— 六个端到端测试在 CI
      # 上从来没跑过,测试绿只是因为它们被跳过了。现在 resetCopy 在没有
      # 素材时会当场生成最小夹具(见 gui/e2e_fixtures_test.go),所以全部跑。
      - name: 测试 GUI(无头 + 端到端)
        working-directory: gui
        run: go test . -count=1
