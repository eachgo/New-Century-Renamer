name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号(不含 v,仅手动触发时使用)"
        required: true
        default: "0.1.3"

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto

jobs:
  release:
    name: 交叉编译并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # GUI 的版本号写在 gui/mygo.json 里,它会被 mygo 写进 exe 的
      # 版本信息与 Linux 包名。tag 才是版本的唯一来源,所以先把它改过来,
      # 免得发出去的 0.1.4 包里 FileVersion 还写着 0.1.3。
      - name: 同步 GUI 版本号
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          python3 - "$v" <<'PY'
          import json, pathlib, sys
          v = sys.argv[1]
          p = pathlib.Path("gui/mygo.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg["version"] = v
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("gui/mygo.json version =", v)
          PY

      # 产物与 build.ps1 -All 一一对应:CLI 用裸 go build(它没有资源要嵌),
      # GUI 必须用 `go tool mygo build` —— 图标、版本信息、清单(逐显示器
      # DPI 感知)都由它写成 .syso 链进可执行文件。裸 go build 出来的 GUI
      # 是白底默认图标,这正是以前"准备了图标但产物没图标"的原因。
      - name: 交叉编译
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          stage="$RUNNER_TEMP/mygo-build"

          build_cli() {
            local goos=$1 goarch=$2 name="ncreamer-$1-$2"
            [ "$goos" = "windows" ] && name="$name.exe"
            echo "CLI  $name"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$v" -o "dist/$name" ./cmd/ncreamer
          }

          # mygo 的 -platform 接受逗号分隔的多个目标,一次调用就能出全平台,
          # 不必按平台循环(每次调用都要重编一遍 mygo 的构建工具)。
          build_gui() {
            echo "GUI  全平台"
            # -skip-installer:不下载 NSIS 做 Windows 安装器
            # -skip-dmg:磁盘镜像只能在 macOS 上做
            ( cd gui && go tool mygo build \
                -platform "windows/amd64,windows/arm64,linux/amd64,linux/arm64,darwin/amd64,darwin/arm64" \
                -skip-installer -skip-dmg -o "$stage" )
          }

          build_cli windows amd64
          build_cli windows arm64
          build_cli linux amd64
          build_cli linux arm64
          build_cli darwin amd64
          build_cli darwin arm64
          build_gui

          # mygo 的输出按 <os>-<arch>/ 分目录,这里摊平成 dist/ 下的发布名
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${t%%/*}"; goarch="${t##*/}"
            src="$stage/$goos-$goarch"
            case "$goos" in
              windows)
                # exe 自带图标,单文件即可发布
                cp "$src/ncreamer-gui.exe" "dist/ncreamer-gui-$goos-$goarch.exe"
                ;;
              darwin)
                # macOS 要的是 .app 包,裸二进制双击打不开
                ( cd "$src" && zip -q -r "$GITHUB_WORKSPACE/dist/ncreamer-gui-$goos-$goarch.zip" "ncreamer-gui.app" )
                ;;
              linux)
                # Linux 的图标在 .desktop 里指向 png,发裸二进制会丢图标,
                # 所以发 mygo 打好的 tar.gz(二进制 + png + desktop + install.sh)
                cp "$src"/*.tar.gz "dist/ncreamer-gui-$goos-$goarch.tar.gz"
                cp "$src"/*.deb "dist/ncreamer-gui_${v}_${goarch}.deb"
                # rpm 用发行版的架构名(x86_64/aarch64),与 GOARCH 不同名,
                # 这里按 goarch 显式挑文件再统一改名,免得 cp 到空
                case "$goarch" in
                  amd64) rpmarch=x86_64 ;;
                  arm64) rpmarch=aarch64 ;;
                esac
                cp "$src"/*."$rpmarch".rpm "dist/ncreamer-gui-${v}-1.${goarch}.rpm"
                ;;
            esac
          done

          ls -l dist

      # 快捷走 CLI:Linux/macOS 用户几乎一定会用 curl 装下来的一条命令。
      # 脚本会顺手用 SHA256SUMS.txt 校验,下载被截断/被替换时直接失败。
      - name: 生成校验和与安装脚本
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v${v}"
          cd dist
          sha256sum ncreamer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            echo '#!/usr/bin/env bash'
            echo '# 把 ncreamer CLI 装到 $PREFIX/bin(默认 /usr/local/bin)'
            echo 'set -euo pipefail'
            echo "VERSION=\"\${NCREAMER_VERSION:-$v}\""
            echo "BASE=\"$base\""
            echo 'PREFIX="${PREFIX:-/usr/local}"'
            echo 'os="$(uname -s | tr "[:upper:]" "[:lower:]")"'
            echo 'arch="$(uname -m)"'
            echo 'case "$arch" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "不支持的架构: $arch"; exit 1 ;; esac'
            echo 'case "$os" in darwin|linux) ;; *) echo "不支持的系统: $os(Windows 请直接下载 exe)"; exit 1 ;; esac'
            echo 'bin="ncreamer-${os}-${arch}"'
            echo 'tmp="$(mktemp)"; sums="$(mktemp)"'
            echo 'trap '"'"'rm -f "$tmp" "$sums"'"'"' EXIT'
            echo 'echo "下载 $BASE/$bin"'
            echo 'curl -fsSL "$BASE/$bin" -o "$tmp"'
            echo 'curl -fsSL "$BASE/SHA256SUMS.txt" -o "$sums"'
            echo 'if command -v sha256sum >/dev/null 2>&1; then'
            echo '  want="$(grep " $bin\$" "$sums" | cut -d" " -f1)"'
            echo '  got="$(sha256sum "$tmp" | cut -d" " -f1)"'
            echo 'else'
            echo '  want="$(grep " $bin\$" "$sums" | cut -d" " -f1)"'
            echo '  got="$(shasum -a 256 "$tmp" | cut -d" " -f1)"'
            echo 'fi'
            echo 'if [ -z "$want" ] || [ "$want" != "$got" ]; then'
            echo '  echo "校验失败:期望 $want,实际 $got"; exit 1'
            echo 'fi'
            echo 'echo "校验通过,安装到 $PREFIX/bin/ncreamer"'
            echo 'chmod +x "$tmp"'
            echo 'mkdir -p "$PREFIX/bin"'
            echo 'mv "$tmp" "$PREFIX/bin/ncreamer"'
            echo 'echo "完成:ncreamer -v"'
          } > install.sh
          sed -i 's/\r$//' install.sh
          chmod +x install.sh
          bash -n install.sh   # 语法自检
          head -5 install.sh

      - name: 打包 zip
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Windows:CLI + GUI 放同一个包,用户解压即用
          mkdir -p pkg-win && cp ncreamer-windows-amd64.exe ncreamer-gui-windows-amd64.exe pkg-win/
          cp "../README.md" "../CHANGELOG.md" pkg-win/ 2>/dev/null || true
          ( cd pkg-win && zip -q -r ../ncreamer-windows-amd64.zip . )
          rm -rf pkg-win
          ls -l

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          # workflow_dispatch 手动触发时没有 tag,临时建一个
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.ver.outputs.version) || github.ref_name }}
          name: 跨向更名器 ${{ steps.ver.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          # 逐个列出,不要用 dist/ncreamer-*,否则会把打包好的 zip 再传一遍
          # ——zip 里已经装着 windows 的两个 exe,重复上传等于多发 24MB。
          files: |
            dist/ncreamer-darwin-amd64
            dist/ncreamer-darwin-arm64
            dist/ncreamer-gui-darwin-amd64.zip
            dist/ncreamer-gui-darwin-arm64.zip
            dist/ncreamer-linux-amd64
            dist/ncreamer-linux-arm64
            dist/ncreamer-gui-linux-amd64.tar.gz
            dist/ncreamer-gui-linux-arm64.tar.gz
            dist/ncreamer-gui_${{ steps.ver.outputs.version }}_amd64.deb
            dist/ncreamer-gui_${{ steps.ver.outputs.version }}_arm64.deb
            dist/ncreamer-gui-${{ steps.ver.outputs.version }}-1.amd64.rpm
            dist/ncreamer-gui-${{ steps.ver.outputs.version }}-1.arm64.rpm
            dist/ncreamer-windows-amd64.exe
            dist/ncreamer-windows-arm64.exe
            dist/ncreamer-gui-windows-amd64.exe
            dist/ncreamer-gui-windows-arm64.exe
            dist/ncreamer-windows-amd64.zip
            dist/SHA256SUMS.txt
            dist/install.sh
